<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnAir Script Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Granular Inline Styles */
    .hl-yellow { background: rgba(250, 204, 21, 0.35); padding: 2px 4px; border-radius: 3px; }
    .hl-cyan { background: rgba(34, 211, 238, 0.35); padding: 2px 4px; border-radius: 3px; }
    .hl-pink { background: rgba(244, 114, 182, 0.35); padding: 2px 4px; border-radius: 3px; }
    .strikethrough { text-decoration: line-through; opacity: 0.35; }

    /* Entire Block Blackout */
    .block-blackout {
      background: #000000 !important;
      border-color: #27272a !important;
      color: #27272a !important;
      filter: blur(4px);
      user-select: none;
      transition: all 0.2s ease;
    }
    .block-blackout:hover { filter: blur(0px); color: #52525b !important; }

    .cue-tag {
      display: inline-block; background: #27272a; color: #fb923c; border: 1px solid #3f3f46;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75em; font-weight: 700;
      padding: 1px 7px; border-radius: 5px; margin-right: 6px; vertical-align: middle;
    }

    /* Floating Selection Toolbar */
    #selectionToolbar {
      position: absolute; display: none; z-index: 100;
      background: #18181b; border: 1px solid #3f3f46; border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      padding: 6px; align-items: center; gap: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Floating Selection Toolbar -->
  <div id="selectionToolbar">
    <button onclick="applyInlineStyle('hl-yellow')" class="w-6 h-6 rounded bg-yellow-400 hover:scale-110 transition-transform" title="Highlight Yellow"></button>
    <button onclick="applyInlineStyle('hl-cyan')" class="w-6 h-6 rounded bg-cyan-400 hover:scale-110 transition-transform" title="Highlight Cyan"></button>
    <button onclick="applyInlineStyle('hl-pink')" class="w-6 h-6 rounded bg-pink-400 hover:scale-110 transition-transform" title="Highlight Pink"></button>
    <button onclick="applyInlineStyle('strikethrough')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-bold" title="Strikethrough">S</button>
    <div class="h-4 w-px bg-zinc-700 mx-1"></div>
    <button onclick="speakSelection()" class="px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-1">🔊 Listen (UK)</button>
  </div>

  <!-- Top SaaS Control Bar -->
  <header class="sticky top-0 z-30 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-5 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <select id="showSelector" onchange="switchShow(this.value)" class="bg-zinc-900 border border-zinc-700 text-zinc-100 font-bold px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        <!-- Populated dynamically -->
      </select>
      <span id="syncBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 mono">LOCAL</span>
    </div>

    <!-- Backtiming & Live Stats Bar -->
    <div class="flex items-center gap-4 text-xs mono bg-zinc-900/80 border border-zinc-800 px-3 py-1.5 rounded-lg">
      <div><span class="text-zinc-500">SCRIPT:</span> <span id="timeTotal" class="text-zinc-200 font-bold">0:00</span></div>
      <div><span class="text-zinc-500">TARGET:</span> <span id="timeTarget" class="text-indigo-400 font-bold">1h</span></div>
      <div><span class="text-zinc-500">DELTA:</span> <span id="timeDelta" class="text-emerald-400 font-bold">On Pace</span></div>
      <div class="hidden sm:block text-zinc-400">| CLOCK: <span id="liveClock" class="text-zinc-200 font-bold">00:00:00</span></div>
    </div>

    <!-- Pro Tools & Actions -->
    <div class="flex items-center gap-2">
      <button onclick="toggleScratchpad()" class="px-3 py-1.5 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 font-medium">Scratchpad</button>
      <button onclick="window.print()" class="px-3 py-1.5 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 font-medium hidden sm:inline-block">Print PDF</button>
      <button onclick="openNewShowModal()" class="px-3 py-1.5 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 font-medium">+ New Show</button>
      <button onclick="openBlockModal('add')" class="px-3.5 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-sm">+ Add Block</button>
    </div>
  </header>

  <!-- Main Content Workspace -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-8 space-y-6">
    
    <!-- Quick Cue Palette Helper Bar -->
    <div class="bg-zinc-900/60 border border-zinc-800 p-2.5 rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="text-zinc-400 font-medium">Quick Insert Cue:</div>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="insertCueToModal('[INTRO]')" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded mono">[INTRO]</button>
        <button onclick="insertCueToModal('[SFX: Bed]')" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded mono">[SFX: Bed]</button>
        <button onclick="insertCueToModal('[COMPETITION / CALLER]')" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-amber-300 rounded mono">[COMPETITION / CALLER]</button>
        <button onclick="insertCueToModal('[AD BREAK]')" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded mono">[AD BREAK]</button>
        <button onclick="insertCueToModal('[TIME CHECK]')" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded mono">[TIME CHECK]</button>
        <button onclick="insertCueToModal('[OUTRO]')" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded mono">[OUTRO]</button>
      </div>
      <div class="text-zinc-500 text-[11px] hidden md:block">Highlight words for TTS or granular styling &bull; Click Blackout to discard block</div>
    </div>

    <!-- Script Blocks Container -->
    <div id="blocksContainer" class="space-y-4">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <!-- Scratchpad Drawer -->
  <div id="scratchpadDrawer" class="fixed right-0 top-0 h-full w-80 bg-zinc-950 border-l border-zinc-800 z-40 p-5 shadow-2xl transform translate-x-full transition-transform duration-200 flex flex-col">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-sm text-zinc-200">Presenter Scratchpad & Notes</h3>
      <button onclick="toggleScratchpad()" class="text-zinc-400 hover:text-white text-lg">&times;</button>
    </div>
    <textarea id="scratchpadText" oninput="saveScratchpad()" placeholder="Jot down caller names, competition winners, contest codes, or reminders here..." class="w-full flex-1 bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 font-mono resize-none"></textarea>
    <div class="text-[11px] text-zinc-500 mt-2">Auto-saves to browser storage.</div>
  </div>

  <!-- Add / Edit Block Modal -->
  <div id="blockModal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-700 rounded-xl max-w-xl w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 id="modalHeaderTitle" class="text-lg font-bold text-white">Add Script Block</h2>
        <button onclick="closeBlockModal()" class="text-zinc-400 hover:text-white text-xl">&times;</button>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-1">Block Text (Use [TAGS] for cues)</label>
        <textarea id="blockTextInput" rows="6" placeholder="[INTRO] Welcome back to the show..." class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-sm text-zinc-100 font-mono focus:outline-none focus:border-indigo-500"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeBlockModal()" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm text-zinc-300">Cancel</button>
        <button onclick="saveBlockModalData()" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white">Save Block</button>
      </div>
    </div>
  </div>

  <!-- New Show Modal -->
  <div id="showModal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-700 rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-white">Create New Broadcast Show</h2>
        <button onclick="closeNewShowModal()" class="text-zinc-400 hover:text-white text-xl">&times;</button>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-1">Show Name</label>
        <input id="newShowName" type="text" placeholder="e.g., Hits of the 80s & 90s" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-1">Target Duration (Hours)</label>
        <input id="newShowHours" type="number" step="0.5" value="1" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeNewShowModal()" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm text-zinc-300">Cancel</button>
        <button onclick="createNewShow()" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white">Create Show</button>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_ENDPOINT = "https://script-buddy-v1-default-rtdb.firebaseio.com/broadcast.json";
    const WPM = 145;

    let appState = {
      activeShowId: "show_morning",
      shows: [
        {
          id: "show_morning",
          title: "Morning Drive & News",
          targetHours: 1,
          blocks: [
            { id: 1, html: '<span class="cue-tag">[INTRO BED]</span> Good morning Stanley!', blackout: false },
            { id: 2, html: '<span class="cue-tag">[COMPETITION]</span> Line 3 is John for the morning mystery voice giveaway.', blackout: false }
          ]
        },
        {
          id: "show_80s90s",
          title: "Hits of the 80s & 90s",
          targetHours: 2,
          blocks: [
            { id: 101, html: '<span class="cue-tag">[INTRO]</span> Welcome back into the retro zone for the next two hours.', blackout: false }
          ]
        }
      ]
    };

    let editingBlockId = null;
    let activeRange = null;

    setInterval(() => {
      document.getElementById("liveClock").textContent = new Date().toTimeString().split(" ")[0];
    }, 1000);

    // Floating Toolbar Selection Listener
    document.addEventListener("mouseup", (e) => {
      const toolbar = document.getElementById("selectionToolbar");
      const selection = window.getSelection();
      
      if (!selection.isCollapsed && selection.toString().trim().length > 0) {
        const range = selection.getRangeAt(0);
        const contentBlock = range.commonAncestorContainer.parentElement.closest(".script-text-area");
        
        if (contentBlock) {
          activeRange = range.cloneRange();
          const rect = range.getBoundingClientRect();
          toolbar.style.top = `${window.scrollY + rect.top - 45}px`;
          toolbar.style.left = `${window.scrollX + rect.left + (rect.width / 2) - 100}px`;
          toolbar.style.display = "flex";
          return;
        }
      }
      toolbar.style.display = "none";
    });

    function applyInlineStyle(styleClass) {
      if (!activeRange) return;
      const span = document.createElement("span");
      span.className = styleClass;
      span.appendChild(activeRange.extractContents());
      activeRange.insertNode(span);
      
      window.getSelection().removeAllRanges();
      document.getElementById("selectionToolbar").style.display = "none";
      persistBlockChanges();
    }

    function speakSelection() {
      const selection = window.getSelection();
      if (!selection.isCollapsed) {
        const textToSpeak = selection.toString();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(textToSpeak);
          utterance.rate = 0.95;
          
          const voices = window.speechSynthesis.getVoices();
          const ukVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK') || v.name.includes('British'));
          if (ukVoice) utterance.voice = ukVoice;
          
          window.speechSynthesis.speak(utterance);
        }
      }
      document.getElementById("selectionToolbar").style.display = "none";
    }

    function persistBlockChanges() {
      const show = appState.shows.find(s => s.id === appState.activeShowId);
      document.querySelectorAll(".script-text-area").forEach(el => {
        const id = parseInt(el.dataset.id);
        const block = show.blocks.find(b => b.id === id);
        if (block) block.html = el.innerHTML;
      });
      saveAndSync();
      render();
    }

    function toggleBlackout(id) {
      const show = appState.shows.find(s => s.id === appState.activeShowId);
      const b = show.blocks.find(x => x.id === id);
      if (b) {
        b.blackout = !b.blackout;
        saveAndSync();
        render();
      }
    }

    function render() {
      const selector = document.getElementById("showSelector");
      selector.innerHTML = "";
      appState.shows.forEach(show => {
        const opt = document.createElement("option");
        opt.value = show.id;
        opt.textContent = `${show.title} (${show.targetHours}h)`;
        if (show.id === appState.activeShowId) opt.selected = true;
        selector.appendChild(opt);
      });

      const currentShow = appState.shows.find(s => s.id === appState.activeShowId) || appState.shows[0];
      document.getElementById("timeTarget").textContent = currentShow.targetHours + "h";

      const container = document.getElementById("blocksContainer");
      container.innerHTML = "";

      let totalWords = 0;

      currentShow.blocks.forEach((block, idx) => {
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = block.html;
        const cleanText = tempDiv.textContent || tempDiv.innerText || "";
        const words = cleanText ? cleanText.split(/\s+/).length : 0;
        totalWords += words;
        const blockSecs = Math.round((words / WPM) * 60);

        const card = document.createElement("div");
        card.className = `script-block group relative p-4 rounded-xl bg-zinc-900/80 border border-zinc-800 transition-all ${block.blackout ? 'block-blackout' : ''}`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div class="script-text-area flex-1 text-[19px] leading-relaxed outline-none" data-id="${block.id}" contenteditable="true" onblur="persistBlockChanges()">${block.html}</div>
            <div class="flex items-center gap-1 opacity-20 group-hover:opacity-100 transition-opacity">
              <button title="Blackout / Discard Block" onclick="toggleBlackout(${block.id})" class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded text-xs font-semibold">Blackout</button>
              <button title="Edit Block Source" onclick="openBlockModal('edit', ${block.id})" class="px-2 py-1 bg-zinc-800 text-indigo-400 rounded text-xs font-semibold">Edit</button>
              <button title="Move Up" onclick="moveBlock(${block.id}, -1)" class="px-1.5 py-1 bg-zinc-800 text-zinc-300 rounded text-xs">▲</button>
              <button title="Move Down" onclick="moveBlock(${block.id}, 1)" class="px-1.5 py-1 bg-zinc-800 text-zinc-300 rounded text-xs">▼</button>
              <button title="Delete" onclick="deleteBlock(${block.id})" class="px-1.5 py-1 bg-red-950/60 text-red-400 rounded text-xs ml-1">🗑</button>
            </div>
          </div>
          <div class="mt-2.5 pt-2 border-t border-zinc-800/60 flex items-center justify-between text-[11px] mono text-zinc-500">
            <span>BLOCK #${idx + 1} &bull; EST. <strong class="text-zinc-400">${blockSecs}s</strong> (${words} words)</span>
            <span class="text-zinc-400">Select text for TTS / granular styling</span>
          </div>
        `;
        container.appendChild(card);
      });

      const totalSecs = Math.round((totalWords / WPM) * 60);
      document.getElementById("timeTotal").textContent = formatTime(totalSecs);

      const targetSecs = currentShow.targetHours * 3600;
      const diffSecs = totalSecs - targetSecs;
      const deltaEl = document.getElementById("timeDelta");
      
      if (Math.abs(diffSecs) < 120) {
        deltaEl.textContent = "On Pace";
        deltaEl.className = "text-emerald-400 font-bold";
      } else if (diffSecs > 0) {
        deltaEl.textContent = `+${Math.round(diffSecs / 60)}m Over`;
        deltaEl.className = "text-amber-400 font-bold";
      } else {
        deltaEl.textContent = `${Math.round(Math.abs(diffSecs) / 60)}m Under`;
        deltaEl.className = "text-cyan-400 font-bold";
      }
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    function switchShow(showId) {
      appState.activeShowId = showId;
      saveAndSync();
      render();
    }

    function moveBlock(id, direction) {
      const show = appState.shows.find(s => s.id === appState.activeShowId);
      const idx = show.blocks.findIndex(b => b.id === id);
      if ((idx + direction >= 0) && (idx + direction < show.blocks.length)) {
        const item = show.blocks.splice(idx, 1)[0];
        show.blocks.splice(idx + direction, 0, item);
        saveAndSync();
        render();
      }
    }

    function deleteBlock(id) {
      const show = appState.shows.find(s => s.id === appState.activeShowId);
      show.blocks = show.blocks.filter(b => b.id !== id);
      saveAndSync();
      render();
    }

    function openBlockModal(mode, id = null) {
      editingBlockId = id;
      const modalTitle = document.getElementById("modalHeaderTitle");
      const textInput = document.getElementById("blockTextInput");

      if (mode === 'edit' && id !== null) {
        modalTitle.textContent = "Edit Script Block";
        const show = appState.shows.find(s => s.id === appState.activeShowId);
        const block = show.blocks.find(b => b.id === id);
        const tmp = document.createElement("div");
        tmp.innerHTML = block ? block.html : "";
        textInput.value = tmp.textContent || tmp.innerText || "";
      } else {
        modalTitle.textContent = "Add Script Block";
        textInput.value = "";
      }
      document.getElementById("blockModal").classList.remove("hidden");
    }

    function closeBlockModal() {
      document.getElementById("blockModal").classList.add("hidden");
      editingBlockId = null;
    }

    function insertCueToModal(tag) {
      const textarea = document.getElementById("blockTextInput");
      const val = textarea.value;
      const selStart = textarea.selectionStart;
      textarea.value = val.substring(0, selStart) + " " + tag + " " + val.substring(textarea.selectionEnd);
      textarea.focus();
    }

    function saveBlockModalData() {
      const rawText = document.getElementById("blockTextInput").value.trim();
      if (!rawText) return;
      const show = appState.shows.find(s => s.id === appState.activeShowId);

      // Auto-tag cues if present
      const formattedHtml = rawText.replace(/\[([^\]]+)\]/g, '<span class="cue-tag">[$1]</span>');

      if (editingBlockId !== null) {
        const block = show.blocks.find(b => b.id === editingBlockId);
        if (block) block.html = formattedHtml;
      } else {
        show.blocks.push({ id: Date.now(), html: formattedHtml, blackout: false });
      }

      closeBlockModal();
      saveAndSync();
      render();
    }

    function openNewShowModal() { document.getElementById("showModal").classList.remove("hidden"); }
    function closeNewShowModal() { document.getElementById("showModal").classList.add("hidden"); }
    function createNewShow() {
      const name = document.getElementById("newShowName").value.trim();
      const hours = parseFloat(document.getElementById("newShowHours").value) || 1;
      if (!name) return;
      const newId = "show_" + Date.now();
      appState.shows.push({ id: newId, title: name, targetHours: hours, blocks: [{ id: Date.now(), html: `<span class="cue-tag">[INTRO]</span> Welcome to ${name}`, blackout: false }] });
      appState.activeShowId = newId;
      closeNewShowModal();
      saveAndSync();
      render();
    }

    function toggleScratchpad() {
      document.getElementById("scratchpadDrawer").classList.toggle("translate-x-full");
    }
    function saveScratchpad() {
      localStorage.setItem("onair_scratchpad", document.getElementById("scratchpadText").value);
    }
    if (localStorage.getItem("onair_scratchpad")) {
      document.getElementById("scratchpadText").value = localStorage.getItem("onair_scratchpad");
    }

    async function saveAndSync() {
      localStorage.setItem("onair_app_state", JSON.stringify(appState));
      if (FIREBASE_ENDPOINT) {
        try {
          const res = await fetch(FIREBASE_ENDPOINT, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(appState)
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          document.getElementById("syncBadge").textContent = "CLOUD SYNCED";
          document.getElementById("syncBadge").className = "text-[11px] px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800 mono";
        } catch (err) {
          document.getElementById("syncBadge").textContent = "LOCAL OFFLINE";
          document.getElementById("syncBadge").className = "text-[11px] px-2 py-0.5 rounded-full bg-amber-950 text-amber-400 border border-amber-800 mono";
        }
      }
    }

    async function initLoad() {
      if (FIREBASE_ENDPOINT) {
        try {
          const res = await fetch(FIREBASE_ENDPOINT);
          const data = await res.json();
          if (data && data.shows) {
            appState = data;
            render();
            return;
          }
        } catch (e) { console.warn("Using local storage fallback"); }
      }
      const saved = localStorage.getItem("onair_app_state");
      if (saved) appState = JSON.parse(saved);
      render();
    }

    initLoad();
  </script>
</body>
</html>
